name: Build TermOS live ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools qemu-system-x86 ovmf file rsync

      - name: Build ISO
        run: sudo ./scripts/build-iso.sh

      - name: Verify ISO
        run: ./scripts/verify-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermOS-v0.3.0-development-amd64
          path: |
            live-image-amd64.hybrid.iso
            live-image-amd64.hybrid.iso.sha256
          if-no-files-found: error
          retention-days: 14
