name: TermOS CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and project metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python source
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Validate shell scripts
        run: |
          sh -n auto/config
          bash -n scripts/*.sh

      - name: Validate Python package metadata
        run: |
          python -m pip install --no-deps .
          termos --version
          termos info
