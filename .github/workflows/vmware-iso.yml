name: TermOS VMware ISO validation

on:
  push:
    branches:
      - fix-vmware-uefi-console
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out TermOS
        uses: actions/checkout@v4

      - name: Install build and virtual-machine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex gawk git patch perl python3 rsync \
            file cpio unzip wget curl xz-utils libncurses-dev libssl-dev \
            libelf-dev qemu-system-x86 ovmf xorriso

      - name: Build TermOS ISO
        env:
          JOBS: "2"
        run: ./scripts/build.sh

      - name: Check ISO format and boot catalog
        run: |
          file build/images/rootfs.iso9660
          test -s build/images/rootfs.iso9660
          xorriso -indev build/images/rootfs.iso9660 -report_el_torito plain
          sha256sum build/images/rootfs.iso9660

      - name: UEFI boot smoke test in QEMU
        shell: bash
        run: |
          set -euo pipefail
          ISO="$PWD/build/images/rootfs.iso9660"
          CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -r "$CODE"
          test -r "$VARS_TEMPLATE"
          cp "$VARS_TEMPLATE" /tmp/OVMF_VARS.fd
          rm -f /tmp/termos-monitor.sock /tmp/termos-serial.log
          qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -cdrom "$ISO" \
            -boot order=d \
            -nic user,model=virtio-net-pci \
            -display none \
            -serial file:/tmp/termos-serial.log \
            -monitor unix:/tmp/termos-monitor.sock,server,nowait \
            -no-reboot &
          QEMU_PID=$!
          cleanup() {
            kill "$QEMU_PID" 2>/dev/null || true
            wait "$QEMU_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 100); do
            [[ -S /tmp/termos-monitor.sock ]] && break
            sleep 0.2
          done
          test -S /tmp/termos-monitor.sock

          # Select the serial-debug GRUB entry so boot progress is observable
          # without relying on a graphical framebuffer in the CI runner.
          sleep 1.5
          python3 - <<'PY'
          import socket, time
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(2)
          s.connect("/tmp/termos-monitor.sock")
          try:
              s.recv(4096)
          except OSError:
              pass
          s.sendall(b"sendkey down\n")
          time.sleep(0.3)
          s.sendall(b"sendkey ret\n")
          time.sleep(0.5)
          s.close()
          PY

          for _ in $(seq 1 60); do
            if grep -Eiq 'login:|TermOS 0\.1' /tmp/termos-serial.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "---- serial boot log (last 160 lines) ----"
          tail -n 160 /tmp/termos-serial.log || true
          grep -Eiq 'login:|TermOS 0\.1' /tmp/termos-serial.log

      - name: Upload ISO and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TermOS-vmware-fix-candidate
          path: |
            build/images/rootfs.iso9660
            /tmp/termos-serial.log
          if-no-files-found: warn
          retention-days: 7
