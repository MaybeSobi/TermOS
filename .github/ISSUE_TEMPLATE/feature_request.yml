name: Feature request
description: Propose a TermOS capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Architecture, security, and package impact
      description: Does this affect Debian packages, privileged operations, boot, disks, or profiles?
