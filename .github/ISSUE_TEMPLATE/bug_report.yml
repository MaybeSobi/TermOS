name: Bug report
description: Report a reproducible TermOS problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove passwords, tokens, personal data, and private system identifiers from logs."
  - type: input
    id: version
    attributes:
      label: TermOS version or commit
      placeholder: "v0.3.0-dev / commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Debian suite, architecture, VM or physical hardware
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and logs
      render: shell
    validations:
      required: true
