[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termos"
version = "0.3.0.dev0"
description = "A modular, CLI-first Linux system built on Debian"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "TermOS contributors" }]
dependencies = []

[project.scripts]
termos = "termos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
