set default="0"
set timeout="5"

menuentry "TermOS 0.1 - Live" {
    linux /boot/bzImage rdinit=/init console=tty0 console=ttyS0,115200n8 loglevel=4
    initrd /boot/initrd
}

menuentry "TermOS 0.1 - Serial Debug" {
    linux /boot/bzImage rdinit=/init console=ttyS0,115200n8 earlycon=uart,io,0x3f8,115200 loglevel=7
    initrd /boot/initrd
}
